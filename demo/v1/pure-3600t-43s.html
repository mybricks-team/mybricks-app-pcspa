<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>云服务器页脚</title>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
        background: #f0f0f0;
        display: flex;
        justify-content: center;
        padding: 40px 0;
      }

      /* ── 页脚整体 ─────────────────────────────── */
      .footer {
        width: 1024px;
        background: #f8f8f8;
        border: 1px solid #e8e8e8;
      }

      /* ── 主内容区 ─────────────────────────────── */
      .footer-main {
        display: flex;
        flex-direction: row;
        align-items: flex-start;
        padding: 40px 48px 32px;
        gap: 0;
      }

      /* ── 品牌列 ───────────────────────────────── */
      .brand-col {
        width: 220px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .brand-logo {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .brand-logo-icon {
        width: 36px;
        height: 36px;
        background: #111827;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      /* 服务器 SVG 图标 */
      .brand-logo-icon svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: #ffffff;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .brand-name {
        font-size: 16px;
        font-weight: 700;
        color: #111827;
        letter-spacing: -0.3px;
      }

      .brand-desc {
        font-size: 13px;
        color: #6b7280;
        line-height: 1.7;
        width: 200px;
      }

      .social-icons {
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 8px;
        margin-top: 4px;
      }

      .social-btn {
        width: 32px;
        height: 32px;
        border-radius: 6px;
        border: 1px solid #e5e7eb;
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        text-decoration: none;
        color: #6b7280;
        transition: border-color 0.2s, color 0.2s;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      }

      .social-btn:hover {
        border-color: #9ca3af;
        color: #111827;
      }

      .social-btn svg {
        width: 15px;
        height: 15px;
        fill: currentColor;
      }

      /* ── 链接列组 ─────────────────────────────── */
      .links-group {
        flex: 1;
        display: flex;
        flex-direction: row;
        justify-content: flex-end;
        gap: 64px;
      }

      .link-col {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .link-col-title {
        font-size: 13px;
        font-weight: 600;
        color: #111827;
        margin-bottom: 8px;
        letter-spacing: 0.1px;
      }

      .link-col a {
        font-size: 13px;
        color: #6b7280;
        text-decoration: none;
        line-height: 1.9;
        transition: color 0.2s;
        display: block;
      }

      .link-col a:hover {
        color: #111827;
      }

      /* ── 分割线 ───────────────────────────────── */
      .footer-divider {
        height: 1px;
        background: #e5e7eb;
        margin: 0 48px;
      }

      /* ── 版权栏 ───────────────────────────────── */
      .footer-bottom {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        padding: 16px 48px;
      }

      .copyright {
        font-size: 13px;
        color: #9ca3af;
      }

      .bottom-links {
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 20px;
      }

      .bottom-links a {
        font-size: 13px;
        color: #9ca3af;
        text-decoration: none;
        transition: color 0.2s;
      }

      .bottom-links a:hover {
        color: #6b7280;
      }

      .bottom-links .divider-pipe {
        color: #d1d5db;
        font-size: 13px;
        user-select: none;
      }
    </style>
  </head>
  <body>

    <footer class="footer">

      <!-- 主内容区 -->
      <div class="footer-main">

        <!-- 品牌列 -->
        <div class="brand-col">
          <!-- Logo + 名称 -->
          <div class="brand-logo">
            <div class="brand-logo-icon">
              <!-- 服务器图标 -->
              <svg viewBox="0 0 24 24">
                <rect x="2" y="3" width="20" height="5" rx="1"/>
                <rect x="2" y="10" width="20" height="5" rx="1"/>
                <rect x="2" y="17" width="20" height="4" rx="1"/>
                <circle cx="19" cy="5.5" r="1" fill="#ffffff" stroke="none"/>
                <circle cx="19" cy="12.5" r="1" fill="#ffffff" stroke="none"/>
              </svg>
            </div>
            <span class="brand-name">CloudServe</span>
          </div>

          <!-- 描述 -->
          <p class="brand-desc">
            稳定、安全、高性能的云计算基础设施服务，助力企业数字化转型。
          </p>

          <!-- 社交图标 -->
          <div class="social-icons">
            <!-- Twitter / X -->
            <a href="#" class="social-btn" aria-label="Twitter">
              <svg viewBox="0 0 24 24">
                <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.737-8.835L1.254 2.25H8.08l4.253 5.622 5.912-5.622zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
              </svg>
            </a>
            <!-- GitHub -->
            <a href="#" class="social-btn" aria-label="GitHub">
              <svg viewBox="0 0 24 24">
                <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
              </svg>
            </a>
            <!-- LinkedIn -->
            <a href="#" class="social-btn" aria-label="LinkedIn">
              <svg viewBox="0 0 24 24">
                <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
              </svg>
            </a>
          </div>
        </div>

        <!-- 链接列组 -->
        <div class="links-group">

          <!-- 产品服务 -->
          <div class="link-col">
            <div class="link-col-title">产品服务</div>
            <a href="#">云服务器</a>
            <a href="#">云数据库</a>
            <a href="#">云存储</a>
            <a href="#">负载均衡</a>
          </div>

          <!-- 解决方案 -->
          <div class="link-col">
            <div class="link-col-title">解决方案</div>
            <a href="#">电商解决方案</a>
            <a href="#">游戏</a>
            <a href="#">金融</a>
            <a href="#">企业办公</a>
          </div>

          <!-- 支持与帮助 -->
          <div class="link-col">
            <div class="link-col-title">支持与帮助</div>
            <a href="#">文档中心</a>
            <a href="#">常见问题</a>
            <a href="#">工单系统</a>
            <a href="#">联系客服</a>
          </div>

        </div>
      </div>

      <!-- 分割线 -->
      <div class="footer-divider"></div>

      <!-- 版权栏 -->
      <div class="footer-bottom">
        <span class="copyright">© 2026 CloudServe Inc. 版权所有</span>
        <div class="bottom-links">
          <a href="#">服务条款</a>
          <a href="#">隐私政策</a>
          <a href="#">Cookie 设置</a>
          <span class="divider-pipe">|</span>
          <a href="https://beian.miit.gov.cn" target="_blank">京ICP备2026001234号</a>
        </div>
      </div>

    </footer>

  </body>
</html>
